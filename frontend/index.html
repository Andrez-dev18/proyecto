<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de Gestión de Pollo - Múltiples Dashboards">
    <title>Sistema de Gestión - Dashboard</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Sidebar */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            width: 260px;
            background: linear-gradient(180deg, #1e3a8a 0%, #1e40af 100%);
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            z-index: 1000;
            box-shadow: 4px 0 10px rgba(0, 0, 0, 0.1);
        }
        
        .sidebar.open {
            transform: translateX(0);
        }
        
        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        
        .sidebar-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        
        .menu-item {
            transition: all 0.2s ease;
        }
        
        .menu-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(5px);
        }
        
        .menu-item.active {
            background: rgba(255, 255, 255, 0.15);
            border-left: 4px solid #60a5fa;
        }
        
        /* Content area */
        .content-wrapper {
            transition: margin-left 0.3s ease;
        }
        
        @media (min-width: 1024px) {
            .sidebar {
                transform: translateX(0);
            }
            
            .content-wrapper {
                margin-left: 260px;
            }
            
            .sidebar-overlay {
                display: none;
            }
            
            .menu-toggle-mobile {
                display: none;
            }
        }
        
        /* Animaciones */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .animate-slide-in {
            animation: slideIn 0.3s ease;
        }
        
        /* Dashboard iframe */
        #dashboardFrame {
            width: 100%;
            min-height: calc(100vh - 80px);
            border: none;
            background: #f9fafb;
        }
        
        /* Loading */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body class="bg-gray-100">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
        <!-- Logo/Header -->
        <div class="p-6 border-b border-blue-700">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-white rounded-lg flex items-center justify-center">
                        <i class="fas fa-chart-line text-blue-600 text-xl"></i>
                    </div>
                    <div>
                        <h2 class="text-white font-bold text-lg">Sistema</h2>
                        <p class="text-blue-300 text-xs">Gestión </p>
                    </div>
                </div>
                <button onclick="toggleSidebar()" class="lg:hidden text-white hover:text-blue-200">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
        </div>
        
        <!-- Menu -->
        <nav class="p-4 space-y-2 overflow-y-auto" style="max-height: calc(100vh - 140px);">
            <div class="mb-4">
                <p class="text-blue-300 text-xs uppercase font-semibold mb-2 px-3">Dashboards</p>
            </div>
            
            <!-- Dashboard Capturas de Pantalla -->
            <a href="#" onclick="loadDashboard('dashboard-capturas.html', this)" 
               class="menu-item active flex items-center gap-3 px-4 py-3 text-white rounded-lg" 
               data-dashboard="capturas">
                <i class="fas fa-camera w-5"></i>
                <span class="font-medium">Capturas de Pantalla</span>
            </a>
            
            <!-- Dashboard Información del Mercado -->
            <a href="#" onclick="loadDashboard('dashboard-comercializacion.html', this)" 
               class="menu-item flex items-center gap-3 px-4 py-3 text-white rounded-lg" 
               data-dashboard="comercializacion">
                <i class="fas fa-shopping-cart w-5"></i>
                <span class="font-medium">Información del Mercado</span>
            </a>
            
            <!-- Separator -->
            <div class="my-4 border-t border-blue-700"></div>
            <!--
            <div class="mb-4">
                <p class="text-blue-300 text-xs uppercase font-semibold mb-2 px-3">Herramientas</p>
            </div>
            
             Reportes 
            <a href="#" class="menu-item flex items-center gap-3 px-4 py-3 text-white rounded-lg">
                <i class="fas fa-file-excel w-5"></i>
                <span class="font-medium">Reportes</span>
            </a>
            
            - Configuración 
            <a href="#" class="menu-item flex items-center gap-3 px-4 py-3 text-white rounded-lg">
                <i class="fas fa-cog w-5"></i>
                <span class="font-medium">Configuración</span>
            </a>
        </nav>-->
        
        <!-- Footer -->
        <div class="absolute bottom-0 left-0 right-0 p-4 border-t border-blue-700">
            <div class="text-center">
                <p class="text-blue-300 text-xs">© 2025</p>
                <p class="text-white text-sm font-semibold">Cesar Osire x Sergio Andre</p>
            </div>
        </div>
    </aside>
    
    <!-- Overlay -->
    <div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>
    
    <!-- Main Content -->
    <div class="content-wrapper">
        <!-- Top Bar -->
        <header class="bg-white shadow-sm sticky top-0 z-50">
            <div class="px-4 py-4 flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <!-- Menu Toggle (Mobile) -->
                    <button onclick="toggleSidebar()" class="menu-toggle-mobile text-gray-600 hover:text-gray-900 lg:hidden">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                    
                    <div>
                        <h1 id="dashboardTitle" class="text-2xl font-bold text-gray-800">Capturas de Pantalla</h1>
                        <p class="text-sm text-gray-500">Sistema de gestión de clientes y proveedores</p>
                    </div>
                </div>
                
                <div class="flex items-center gap-4">
                    <!-- User Info -->
                    <div class="hidden md:flex items-center gap-3">
                        <div class="text-right">
                            <p class="text-sm font-semibold text-gray-700">Usuario Admin</p>
                            <p class="text-xs text-gray-500">Administrador</p>
                        </div>
                        <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-full flex items-center justify-center">
                            <i class="fas fa-user text-white"></i>
                        </div>
                    </div>
                </div>
            </div>
        </header>
        
        <!-- Dashboard Content -->
        <main class="p-6 relative">
            <div id="loadingIndicator" class="loading hidden">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
            </div>
            
            <iframe 
                id="dashboardFrame" 
                src="dashboard-capturas.html"
                onload="hideLoading()">
            </iframe>
        </main>
    </div>
    
    <script>
        // Toggle Sidebar
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }
        
        // Load Dashboard
        function loadDashboard(url, element) {
            // Prevenir comportamiento por defecto del enlace
            event.preventDefault();
            
            // Mostrar loading
            showLoading();
            
            // Actualizar menu activo
            document.querySelectorAll('.menu-item').forEach(item => {
                item.classList.remove('active');
            });
            element.classList.add('active');
            
            // Cargar dashboard
            const frame = document.getElementById('dashboardFrame');
            frame.src = url;
            
            // Actualizar título
            const titles = {
                'dashboard-capturas.html': 'Capturas de Pantalla',
                'dashboard-comercializacion.html': 'Información del Mercado'
            };
            document.getElementById('dashboardTitle').textContent = titles[url] || 'Dashboard';
            
            // Cerrar sidebar en móvil
            if (window.innerWidth < 1024) {
                toggleSidebar();
            }
        }
        
        // Loading functions
        function showLoading() {
            document.getElementById('loadingIndicator').classList.remove('hidden');
        }
        
        function hideLoading() {
            document.getElementById('loadingIndicator').classList.add('hidden');
        }
        
        // Responsive: cerrar sidebar al hacer clic fuera
        window.addEventListener('resize', () => {
            if (window.innerWidth >= 1024) {
                document.getElementById('sidebar').classList.add('open');
                document.getElementById('sidebarOverlay').classList.remove('active');
            }
        });
        
        // Inicializar sidebar abierto en desktop
        if (window.innerWidth >= 1024) {
            document.getElementById('sidebar').classList.add('open');
        }
    </script>
</body>
</html>
