        /* Sidebar */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            width: 260px;
            background: linear-gradient(180deg, #1e3a8a 0%, #1e40af 100%);
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            z-index: 1000;
            box-shadow: 4px 0 10px rgba(0, 0, 0, 0.1);
        }

        .sidebar.open {
            transform: translateX(0);
        }

        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .sidebar-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .menu-item {
            transition: all 0.2s ease;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(5px);
        }

        .menu-item.active {
            background: rgba(255, 255, 255, 0.15);
            border-left: 4px solid #60a5fa;
        }

        /* Content area */
        .content-wrapper {
            transition: margin-left 0.3s ease;
        }

        @media (min-width: 1024px) {
            .sidebar {
                transform: translateX(0);
            }

            .content-wrapper {
                margin-left: 260px;
            }

            .sidebar-overlay {
                display: none;
            }

            .menu-toggle-mobile {
                display: none;
            }
        }

        /* Animaciones */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-slide-in {
            animation: slideIn 0.3s ease;
        }

        /* Dashboard iframe */
        #dashboardFrame {
            width: 100%;
            min-height: calc(100vh - 80px);
            border: none;
            background: #f9fafb;
        }

        /* Loading */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>

    <script>
        // Toggle Sidebar
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');

            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }

        // Load Dashboard
        function loadDashboard(url, element) {
            // Prevenir comportamiento por defecto del enlace
            event.preventDefault();

            // Mostrar loading
            showLoading();

            // Actualizar menu activo
            document.querySelectorAll('.menu-item').forEach(item => {
                item.classList.remove('active');
            });
            element.classList.add('active');

            // Cargar dashboard
            const frame = document.getElementById('dashboardFrame');
            frame.src = url;

            // Actualizar título
            const titles = {
                'dashboard-capturas.html': 'Capturas de Pantalla',
                'dashboard-comercializacion.html': 'Información del Mercado'
            };
            document.getElementById('dashboardTitle').textContent = titles[url] || 'Dashboard';

            // Cerrar sidebar en móvil
            if (window.innerWidth < 1024) {
                toggleSidebar();
            }
        }


        function loadDashboardAndData(dashboardUrl, tipo) {
            const frame = document.getElementById('dashboardFrame');
            const titulo = document.getElementById('dashboardTitle');
            const titles = {
                'dashboard-capturas.html': 'Capturas de Pantalla',
                'dashboard-comercializacion.html': 'Información del Mercado'
            };

            titulo.textContent = titles[dashboardUrl] || 'Dashboard';
            showLoading();

            const run = () => {
                try {
                    if (frame.contentWindow && typeof frame.contentWindow.cargarDatos === 'function') {
                        frame.contentWindow.cargarDatos(tipo);
                    } else {
                        console.error("La función cargarDatos no existe en el iframe.");
                    }
                } finally {
                    hideLoading();
                }
            };

            if (frame.src.includes(dashboardUrl)) {
                // ya está cargado ese dashboard
                run();
            } else {
                // esperar a que el nuevo dashboard se cargue
                frame.onload = run;
                frame.src = dashboardUrl;
            }

            if (window.innerWidth < 1024) toggleSidebar();
        }

        // Loading functions
        function showLoading() {
            document.getElementById('loadingIndicator').classList.remove('hidden');
        }

        function hideLoading() {
            document.getElementById('loadingIndicator').classList.add('hidden');
        }

        // Responsive: cerrar sidebar al hacer clic fuera
        window.addEventListener('resize', () => {
            if (window.innerWidth >= 1024) {
                document.getElementById('sidebar').classList.add('open');
                document.getElementById('sidebarOverlay').classList.remove('active');
            }
        });

        // Inicializar sidebar abierto en desktop
        if (window.innerWidth >= 1024) {
            document.getElementById('sidebar').classList.add('open');
        }
    </script>
