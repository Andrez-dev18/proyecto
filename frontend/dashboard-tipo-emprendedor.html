<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Tipo Emprendedor</title>
    <link rel="stylesheet" href="css/output.css">
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/2.0.8/css/dataTables.dataTables.min.css">
    
    <style>
        .col-codigo {
            width: 100px;
            max-width: 100px;
        }
        
        .col-nombre {
            width: auto;
            min-width: 300px;
        }
        
        .col-linea {
            width: 200px;
            max-width: 200px;
        }
        
        .col-opciones {
            width: 150px;
            max-width: 150px;
        }
        
        table {
            table-layout: fixed;
            width: 100%;
        }
        
        .table-scroll {
            overflow-x: auto;
        }

        .card-shadow {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .btn-hover-scale {
            transition: transform 0.2s ease;
        }

        .btn-hover-scale:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50">
    <div class="container mx-auto px-4 py-4">
        <!-- Header -->
        <header class="mb-6">
            <h1 class="text-3xl font-bold text-gray-800 flex items-center gap-3">
                <i class="fas fa-user-tie text-purple-600"></i>
                Gestión de Tipos de Emprendedor
            </h1>
            <p class="text-gray-600 mt-2">Administra los tipos de emprendedor del sistema</p>
        </header>

        <!-- Acciones -->
        <section class="bg-white rounded-2xl card-shadow p-4 mb-4">
            <h2 class="text-xl font-bold text-gray-700 mb-4 flex items-center gap-2">
                <i class="fas fa-tools text-purple-600"></i>
                Acciones
            </h2>
            <div class="flex gap-3">
                <button id="btnNuevo" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg btn-hover-scale">
                    <i class="fas fa-plus mr-2"></i>Nuevo Tipo de Emprendedor
                </button>
                <button id="btnExportar" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg btn-hover-scale">
                    <i class="fas fa-file-excel mr-2"></i>Exportar Excel
                </button>
            </div>
        </section>

        <!-- Tabla -->
        <section class="bg-white rounded-2xl card-shadow p-6">
            <h2 class="text-xl font-bold text-gray-700 mb-4 flex items-center gap-2">
                <i class="fas fa-table text-purple-600"></i>
                Listado de Tipos de Emprendedor
            </h2>
            <div class="table-scroll">
                <table id="tablaEmprendedor" class="min-w-full display">
                    <thead class="bg-gradient-to-r from-blue-600 to-blue-700 text-white">
                        <tr>
                            <th class="col-codigo px-4 py-3 text-center text-xs font-semibold uppercase">CÓDIGO</th>
                            <th class="col-nombre px-4 py-3 text-left text-xs font-semibold uppercase">NOMBRE</th>
                            <th class="col-linea px-4 py-3 text-left text-xs font-semibold uppercase">LÍNEA</th>
                            <th class="col-opciones px-4 py-3 text-center text-xs font-semibold uppercase">OPCIONES</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="4" class="text-center py-8 text-gray-500">Cargando datos...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- Modal -->
    <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50" style="display:none">
        <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full mx-4">
            <div class="bg-gradient-to-r from-purple-500 to-indigo-600 p-6 rounded-t-2xl">
                <h3 id="modalTitle" class="text-2xl font-bold text-white">Nuevo Tipo de Emprendedor</h3>
            </div>
            <div class="p-6">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nombre *</label>
                    <input type="text" id="modalNombre" required
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Línea *</label>
                    <input type="text" id="modalLinea" required
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                </div>
                <div class="flex justify-end gap-3 mt-6">
                    <button id="btnCancelar" class="bg-gray-500 hover:bg-gray-600 text-white px-6 py-2 rounded-lg">
                        Cancelar
                    </button>
                    <button id="btnGuardar" class="bg-purple-500 hover:bg-purple-600 text-white px-6 py-2 rounded-lg">
                        <i class="fas fa-save mr-2"></i>Guardar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading -->
    <div id="loading" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50" style="display:none">
        <div class="bg-white p-6 rounded-xl shadow-2xl">
            <i class="fas fa-spinner fa-spin text-4xl text-purple-600 mb-2"></i>
            <p class="text-gray-700">Cargando...</p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/2.0.8/js/dataTables.min.js"></script>
    
    <!-- Archivos de configuración y lógica -->
    <script src="js/config/config.tipo-emprendedor.js"></script>
    <script src="js/services/tipo-emprendedor.service.js"></script>
    <script src="js/controllers/tipo-emprendedor.controller.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.tipoEmprendedorController) {
                window.tipoEmprendedorController.init();
            }
        });
    </script>
</body>
</html>
