<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Tipo Emprendedor</title>

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="css/output.css">

    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    
    <style>
        .table-scroll {
            max-height: calc(100vh - 450px);
            min-height: 650px;
            overflow-y: auto;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
        }

        .table-scroll table {
            border-collapse: separate;
            border-spacing: 0;
        }

        .table-scroll th {
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .table-scroll th,
        .table-scroll td {
            border-bottom: 1px solid #e5e7eb;
            white-space: nowrap;
        }

        .table-scroll tbody tr:hover {
            background-color: #f8fafc;
        }

        .filter-group {
            border-radius: 0.5rem;
            padding: 1rem;
            background-color: #f8fafc;
        }

        .card-shadow {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .btn-hover-scale {
            transition: transform 0.2s ease;
        }

        .btn-hover-scale:hover {
            transform: translateY(-2px);
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .slide-down {
            animation: slideDown 0.4s ease;
        }

        /* Estilos para el dropdown de columnas */
        .dropdown-columns {
            position: relative;
            display: inline-block;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            background-color: white;
            min-width: 300px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            z-index: 1000;
            max-height: 500px;
            overflow-y: auto;
            margin-top: 8px;
        }

        .dropdown-content.show {
            display: block;
        }

        .column-toggle {
            padding: 10px 16px;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .column-toggle:hover {
            background-color: #f3f4f6;
        }

        .column-toggle input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .dropdown-header {
            padding: 12px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 600;
            border-radius: 8px 8px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Distribución mejorada de columnas */
        .col-codigo {
            width: 100px !important;
            max-width: 100px !important;
        }

        .col-nombre {
            width: auto !important;
            min-width: 250px !important;
        }

        .col-linea {
            width: 150px !important;
            max-width: 150px !important;
        }

        .col-opciones {
            width: 120px !important;
            max-width: 120px !important;
        }

        table {
            table-layout: fixed;
            width: 100%;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50">
    <div class="container mx-auto px-4 py-4">

        <!-- Acciones -->
        <section class="bg-white rounded-2xl card-shadow p-4 mb-4 slide-down">
            <h2 class="text-xl font-bold text-gray-700 mb-4 flex items-center gap-2">
                <i class="fas fa-tools text-purple-600"></i>
                Acciones
            </h2>
            <div class="flex flex-wrap gap-3 items-center justify-between">
                <div class="flex flex-wrap gap-3">
                    <button id="btnNuevo"
                        class="bg-green-500 hover:bg-green-600 text-white font-semibold py-2 px-4 rounded-lg shadow btn-hover-scale">
                        <i class="fas fa-plus mr-2"></i>
                        Nuevo Registro
                    </button>
                    <button id="btnExportar"
                        class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg shadow btn-hover-scale">
                        <i class="fas fa-file-excel mr-2"></i>
                        Exportar Excel
                    </button>
                </div>

                <div class="dropdown-columns">
                    <button id="btnToggleColumns" 
                        class="bg-purple-500 hover:bg-purple-600 text-white font-semibold py-2 px-4 rounded-lg shadow btn-hover-scale flex items-center gap-2">
                        <i class="fas fa-columns"></i>
                        Mostrar/Ocultar columnas
                        <i class="fas fa-chevron-down text-sm"></i>
                    </button>
                    
                    <div id="columnDropdown" class="dropdown-content">
                        <div class="dropdown-header">
                            <span>Seleccionar Columnas</span>
                            <button id="btnCloseDropdown" class="text-white hover:text-gray-200">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                        <div class="p-2">
                            <label class="column-toggle">
                                <input type="checkbox" class="column-checkbox" data-column="0" checked>
                                <span>Código</span>
                            </label>
                            <label class="column-toggle">
                                <input type="checkbox" class="column-checkbox" data-column="1" checked>
                                <span>Nombre</span>
                            </label>
                            <label class="column-toggle">
                                <input type="checkbox" class="column-checkbox" data-column="2" checked>
                                <span>Línea</span>
                            </label>
                            <label class="column-toggle">
                                <input type="checkbox" class="column-checkbox" data-column="3" checked disabled>
                                <span>Opciones (siempre visible)</span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Tabla -->
        <section class="bg-white rounded-2xl card-shadow p-6 slide-down">
            <h2 class="text-xl font-bold text-gray-700 mb-4 flex items-center gap-2">
                <i class="fas fa-table text-purple-600"></i>
                Registros
            </h2>
            <div class="table-scroll">
                <table class="min-w-full">
                    <thead class="bg-gradient-to-r from-blue-600 to-blue-700 text-white sticky top-0">
                        <tr>
                            <th class="col-codigo px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider">CÓDIGO</th>
                            <th class="col-nombre px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider">NOMBRE</th>
                            <th class="col-linea px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider">LÍNEA</th>
                            <th class="col-opciones px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider">OPCIONES</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="4" class="text-center py-8 text-gray-500">Selecciona un tipo de datos para comenzar</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- Modal -->
    <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 p-4"
        style="display: none; overflow-y: auto;">
        <div class="bg-white rounded-2xl shadow-2xl max-w-4xl w-full my-8" style="max-height: calc(100vh - 4rem);">
            <div class="bg-gradient-to-r from-purple-500 to-indigo-600 p-6 rounded-t-2xl sticky top-0 z-10">
                <h3 id="modalTitle" class="text-2xl font-bold text-white">Nuevo Registro</h3>
            </div>
            <form id="modalForm" class="p-6" style="max-height: calc(100vh - 12rem); overflow-y: auto;">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre del Tipo *</label>
                        <input type="text" id="modalNombre" required
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Línea *</label>
                        <input type="text" id="modalLinea" required
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>
                </div>

                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" id="btnCancelar"
                        class="bg-gray-500 hover:bg-gray-600 text-white font-semibold py-2 px-6 rounded-lg">
                        Cancelar
                    </button>
                    <button type="button" id="btnGuardar"
                        class="bg-purple-500 hover:bg-purple-600 text-white font-semibold py-2 px-6 rounded-lg">
                        <i class="fas fa-save mr-2"></i>
                        Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Loading -->
    <div id="loading" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50"
        style="display: none;">
        <div class="bg-white p-6 rounded-xl shadow-2xl">
            <i class="fas fa-spinner fa-spin text-4xl text-purple-600 mb-2"></i>
            <p class="text-gray-700">Cargando...</p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/2.0.8/css/dataTables.dataTables.min.css">
    <script src="https://cdn.datatables.net/2.0.8/js/dataTables.min.js"></script>

    <script src="js/config/config.js"></script>
    <script src="js/config/config.tipo-emprendedor.js"></script>
    <script src="js/services/tipo-emprendedor.service.js"></script>
    <script src="js/controllers/tipo-emprendedor.controller.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            tipoEmprendedorController.init();
        });

        window.cargarDatos = async function () {
            if (window.tipoEmprendedorController && typeof window.tipoEmprendedorController.cargarDatos === 'function') {
                await window.tipoEmprendedorController.cargarDatos();
            } else {
                console.error("tipoEmprendedorController.cargarDatos no está definido");
            }
        };
    </script>
    <script src="js/utils/funcionesVarias.js"></script>
</body>
</html>
