<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión GRS - Condición</title>

    <link rel="stylesheet" href="css/output.css">
    <link rel="stylesheet" href="assets/css/datatables.min.css">
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    
    <style>
        .table-container {
            background: white;
            border-radius: 0.75rem;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .table-scroll {
            overflow-x: auto;
            overflow-y: visible;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        thead th {
            padding: 1rem;
            text-align: left;
            font-weight: 600;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        tbody tr {
            border-bottom: 1px solid #e5e7eb;
            transition: background-color 0.2s;
        }

        tbody tr:hover {
            background-color: #f9fafb;
        }

        tbody td {
            padding: 0.75rem 1rem;
            font-size: 0.875rem;
        }

        .card-shadow {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .btn-hover-scale {
            transition: transform 0.2s ease;
        }

        .btn-hover-scale:hover {
            transform: translateY(-2px);
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .slide-down {
            animation: slideDown 0.4s ease;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100%);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideOutRight {
            from {
                opacity: 1;
                transform: translateX(0);
            }
            to {
                opacity: 0;
                transform: translateX(100%);
            }
        }

        .dropdown-columns {
            position: relative;
            display: inline-block;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            background-color: white;
            min-width: 300px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            z-index: 1000;
            max-height: 500px;
            overflow-y: auto;
            margin-top: 8px;
        }

        .dropdown-content.show {
            display: block;
        }

        .column-toggle {
            padding: 10px 16px;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .column-toggle:hover {
            background-color: #f3f4f6;
        }

        .column-toggle input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .dropdown-header {
            padding: 12px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 600;
            border-radius: 8px 8px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Ajustes para DataTables */
        .dataTables_wrapper {
            padding: 1.5rem;
        }

        .dataTables_length select {
            padding: 0.375rem 2rem 0.375rem 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 0.375rem;
            font-size: 0.875rem;
        }

        .dataTables_filter input {
            padding: 0.5rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            width: 250px;
        }

        .dataTables_info {
            font-size: 0.875rem;
            color: #6b7280;
        }

        .dataTables_paginate {
            display: flex;
            gap: 0.25rem;
        }

        .paginate_button {
            padding: 0.5rem 1rem;
            border: 1px solid #d1d5db;
            background: white;
            color: #374151;
            border-radius: 0.375rem;
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .paginate_button:hover:not(.disabled) {
            background: #f3f4f6;
            border-color: #9ca3af;
        }

        .paginate_button.current {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }

        .paginate_button.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Header del sistema */
        .system-header {
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            padding: 1.5rem;
            border-bottom: 2px solid #d1d5db;
            margin-bottom: 2rem;
        }

        .action-buttons {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }
    </style>
</head>

    <div class="container mx-auto px-4">
        <!-- Acciones -->
        <section class="bg-white rounded-xl card-shadow p-6 mb-6 slide-down">
            <h2 class="text-xl font-bold text-gray-700 mb-4 flex items-center gap-2">
                <i class="fas fa-tools text-purple-600"></i>
                Acciones
            </h2>
            <div class="flex flex-wrap gap-3 items-center justify-between">
                <div class="flex flex-wrap gap-3">
                    <button id="btnNuevo"
                        class="bg-green-500 hover:bg-green-600 text-white font-semibold py-2 px-4 rounded-lg shadow btn-hover-scale">
                        <i class="fas fa-plus mr-2"></i>
                        Nuevo Tipo
                    </button>
                   <!-- <button id="btnExportar"
                        class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg shadow btn-hover-scale">
                        <i class="fas fa-file-excel mr-2"></i>
                        Exportar Excel
                    </button>-->
                </div>

                <!-- Combobox para Mostrar/Ocultar Columnas -->
                <div class="dropdown-columns">
                    <button id="btnToggleColumns"
                        class="bg-purple-500 hover:bg-purple-600 text-white font-semibold py-2 px-4 rounded-lg shadow btn-hover-scale flex items-center gap-2">
                        <i class="fas fa-columns"></i>
                        Mostrar/Ocultar columnas
                        <i class="fas fa-chevron-down text-sm"></i>
                    </button>

                    <div id="columnDropdown" class="dropdown-content">
                        <div class="dropdown-header">
                            <span>Seleccionar Columnas</span>
                            <button id="btnCloseDropdown" class="text-white hover:text-gray-200">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                        <div class="p-2">
                            <label class="column-toggle">
                                <input type="checkbox" class="column-checkbox" data-column="0" checked>
                                <span>Código</span>
                            </label>
                            <label class="column-toggle">
                                <input type="checkbox" class="column-checkbox" data-column="1" checked>
                                <span>Nombre</span>
                            </label>
                            <label class="column-toggle">
                                <input type="checkbox" class="column-checkbox" data-column="2" checked>
                                <span>Línea</span>
                            </label>
                            <label class="column-toggle">
                                <input type="checkbox" class="column-checkbox" data-column="3" checked disabled>
                                <span>Opciones (siempre visible)</span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Tabla -->
<section class="bg-white rounded-2xl card-shadow p-6 slide-down">
    <h2 class="text-xl font-bold text-gray-700 mb-4 flex items-center gap-2">
        <i class="fas fa-table text-purple-600"></i>
        Registros
    </h2>
    
    <div class="overflow-x-auto overflow-y-visible" style="max-width: 100%;">
        <div class="min-w-full inline-block align-middle">
            <div class="overflow-hidden border rounded-lg">
                <table class="min-w-full divide-y divide-gray-200" id="tablaTipos">
                    <thead>
                        <tr>
                            <th style="width: 15%;">CÓDIGO</th>
                            <th style="width: 40%;">NOMBRE</th>
                            <th style="width: 30%;">LÍNEA</th>
                            <th style="width: 15%;" class="text-center">OPCIONES</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="bg-white divide-y divide-gray-200">
                        <tr>
                            <td colspan="4" class="text-center py-8 text-gray-500">Cargando datos...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>


    <!-- Modal -->
    <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 p-4"
        style="display: none;">
        <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full">
            <div class="bg-gradient-to-r from-purple-500 to-indigo-600 p-6 rounded-t-2xl">
                <h3 id="modalTitle" class="text-2xl font-bold text-white">Nuevo Tipo</h3>
            </div>
            <form id="modalForm" class="p-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre *</label>
                        <input type="text" id="modalNombre" required
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Línea</label>
                        <input type="text" id="modalLinea"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>
                </div>

                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" id="btnCancelar"
                        class="bg-gray-500 hover:bg-gray-600 text-white font-semibold py-2 px-6 rounded-lg">
                        Cancelar
                    </button>
                    <button type="button" id="btnGuardar"
                        class="bg-purple-500 hover:bg-purple-600 text-white font-semibold py-2 px-6 rounded-lg">
                        <i class="fas fa-save mr-2"></i>
                        Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Loading -->
    <div id="loading" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50"
        style="display: none;">
        <div class="bg-white p-6 rounded-xl shadow-2xl">
            <i class="fas fa-spinner fa-spin text-4xl text-purple-600 mb-2"></i>
            <p class="text-gray-700">Cargando...</p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/2.0.8/css/dataTables.dataTables.min.css">
    <script src="https://cdn.datatables.net/2.0.8/js/dataTables.min.js"></script>

    <script src="js/config/config.js"></script>
    <script src="js/config/config.condicion.js"></script>
    <script src="js/services/condicion.service.js"></script>
    <script src="js/controllers/condicion.controller.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            condicionController.init();
        });
    </script>
</body>

</html>
