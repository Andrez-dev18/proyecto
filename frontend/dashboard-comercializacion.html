<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Información del Mercado</title>
     <!-- Tailwind CSS -->
    <link rel="stylesheet" href="css/output.css">
    <link rel="stylesheet" href="assets/css/datatables.min.css">
    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    

    <style>
        .table-scroll {
            max-height: calc(100vh - 450px);
            min-height: 650px;
            overflow-y: auto;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
        }

        .table-scroll table {
            border-collapse: separate;
            border-spacing: 0;
        }

        .table-scroll th {
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .table-scroll th,
        .table-scroll td {
            border-bottom: 1px solid #e5e7eb;
            white-space: nowrap;
        }

        .table-scroll tbody tr:hover {
            background-color: #f8fafc;
        }

        .filter-group {
            border-radius: 0.5rem;
            padding: 1rem;
            background-color: #f8fafc;
        }

        .card-shadow {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .btn-hover-scale {
            transition: transform 0.2s ease;
        }

        .btn-hover-scale:hover {
            transform: translateY(-2px);
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .slide-down {
            animation: slideDown 0.4s ease;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100%);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideOutRight {
            from {
                opacity: 1;
                transform: translateX(0);
            }

            to {
                opacity: 0;
                transform: translateX(100%);
            }
        }

        /* Estilos para el dropdown de columnas */
.dropdown-columns {
    position: relative;
    display: inline-block;
}

.dropdown-content {
    display: none;
    position: absolute;
    right: 0;
    background-color: white;
    min-width: 300px;
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
    border-radius: 8px;
    z-index: 1000;
    max-height: 500px;
    overflow-y: auto;
    margin-top: 8px;
}

.dropdown-content.show {
    display: block;
}

.column-toggle {
    padding: 12px 16px;
    cursor: pointer;
    transition: background-color 0.2s;
    display: flex;
    align-items: center;
    gap: 10px;
}

.column-toggle:hover {
    background-color: #f3f4f6;
}

.column-toggle input[type="checkbox"] {
    width: 18px;
    height: 18px;
    cursor: pointer;
}

.dropdown-header {
    padding: 12px 16px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    font-weight: 600;
    border-radius: 8px 8px 0 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

    </style>
</head>

<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50">
    <div class="container mx-auto px-4 py-6">
<!-- Acciones -->
<section class="bg-white rounded-2xl card-shadow p-4 mb-4 slide-down">
    <h2 class="text-xl font-bold text-gray-700 mb-4 flex items-center gap-2">
        <i class="fas fa-tools text-purple-600"></i>
        Acciones
    </h2>
    <div class="flex flex-wrap gap-3 items-center justify-between">
        <div class="flex flex-wrap gap-3">
            <button id="btnNuevo"
                class="bg-green-500 hover:bg-green-600 text-white font-semibold py-2 px-4 rounded-lg shadow btn-hover-scale">
                <i class="fas fa-plus mr-2"></i>
                Nuevo Registro
            </button>
            <button id="btnExportar"
                class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg shadow btn-hover-scale">
                <i class="fas fa-file-excel mr-2"></i>
                Exportar Excel
            </button>
        </div>

        <!-- 🔹 Dropdown para columnas -->
        <div class="dropdown-columns">
            <button id="btnToggleColumns" 
                class="bg-purple-500 hover:bg-purple-600 text-white font-semibold py-2 px-4 rounded-lg shadow btn-hover-scale flex items-center gap-2">
                <i class="fas fa-columns"></i>
                Mostrar/Ocultar columnas
                <i class="fas fa-chevron-down text-sm"></i>
            </button>
            
            <div id="columnDropdown" class="dropdown-content">
                <div class="dropdown-header">
                    <span>Seleccionar Columnas</span>
                    <button id="btnCloseDropdown" class="text-white hover:text-gray-200">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div id="columnCheckboxContainer" class="p-2">
                    <!-- Los checkboxes se generarán dinámicamente aquí -->
                </div>
            </div>
        </div>
    </div>
</section>


        <!-- Filtros -->
        <section id="filterSection" class="bg-white rounded-2xl card-shadow p-6 mb-6 slide-down">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-bold text-gray-700 flex items-center gap-2">
                    <i class="fas fa-sliders-h text-purple-600"></i>
                    Filtros
                </h2>
                <!-- Botón para ocultar/mostrar filtros -->
                <button id="btnToggleFiltros" class="text-gray-500 hover:text-purple-600 transition">
                    <i class="fas fa-chevron-up"></i>
                </button>
                <button id="btnLimpiarFiltros" class="text-purple-600 hover:text-purple-700 font-semibold">
                    <i class="fas fa-times-circle mr-1"></i>
                    Limpiar filtros
                </button>
            </div>
            <div id="filterContent" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <!-- Filtros principales siempre visibles -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-calendar-alt mr-1 text-purple-600"></i>
                        Fecha Inicio
                    </label>
                    <input type="date" id="filterFechaInicio"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-calendar-alt mr-1 text-purple-600"></i>
                        Fecha Fin
                    </label>
                    <input type="date" id="filterFechaFin"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-user mr-1 text-purple-600"></i>
                        Proveedor
                    </label>
                    <select id="filterProveedor"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                        <option value="">Todos los proveedores</option>
                    </select>
                </div>
                <!-- Filtros de Arequipa -->
                <div class="filter-arequipa">
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-store mr-1 text-purple-600"></i>
                        Mercado
                    </label>
                    <select id="filterMercado"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                        <option value="">Todos los mercados</option>
                    </select>
                </div>
                <div class="filter-arequipa">
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-check-circle mr-1 text-purple-600"></i>
                        Condición
                    </label>
                    <select id="filterCondicion"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                        <option value="">Todas las condiciones</option>
                    </select>
                </div>
                <!-- Filtros de Provincia -->
                <div class="filter-provincia" style="display: none;">
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-map-marker-alt mr-1 text-purple-600"></i>
                        Provincia
                    </label>
                    <select id="filterProvincia"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                        <option value="">Todas las provincias</option>
                    </select>
                </div>
                <div class="filter-provincia" style="display: none;">
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-tag mr-1 text-purple-600"></i>
                        Tipo
                    </label>
                    <select id="filterTipo"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                        <option value="">Todos los tipos</option>
                    </select>
                </div>
                <div class="mt-6 flex items-end">
                    <button id="btnAplicarFiltros"
                        class="bg-purple-500 hover:bg-purple-600 text-white font-semibold py-2 px-4 rounded-lg shadow btn-hover-scale">
                        <i class="fa-solid fa-filter"></i>
                        Filtrar
                    </button>
                </div>
            </div>
        </section>

        

        <!-- Tabla -->
        <section class="bg-white rounded-2xl card-shadow p-6 slide-down">
            <h2 class="text-xl font-bold text-gray-700 mb-4 flex items-center gap-2">
                <i class="fas fa-table text-purple-600"></i>
                Registros
            </h2>
            <div class="table-scroll">
                <table class="min-w-full">
                    <thead class="bg-gradient-to-r from-blue-600 to-blue-700 text-white sticky top-0">
                        <tr>
                            <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider w-12">#</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider">FECHA</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider">MERCADO</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider">EMPRESA</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider">RUC.EMPR</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider">CONDICION
                            </th>
                            <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider">PROVEEDOR
                            </th>
                            <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider">RUC.PROVE
                            </th>
                            <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider">COND/TIPO
                            </th>
                            <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider">P.MAYOR
                            </th>
                            <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider">P.PÚBLICO
                            </th>
                            <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider">PESOS</th>
                            <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider">PROM.PESO
                            </th>
                            <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider">COLOR</th>
                            <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider w-20">CANT.
                            </th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="8" class="text-center py-8 text-gray-500">Selecciona un tipo de datos para
                                comenzar</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- Modal -->
    <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 p-4"
        style="display: none; overflow-y: auto;">
        <div class="bg-white rounded-2xl shadow-2xl max-w-4xl w-full my-8" style="max-height: calc(100vh - 4rem);">
            <div class="bg-gradient-to-r from-purple-500 to-indigo-600 p-6 rounded-t-2xl sticky top-0 z-10">
                <h3 id="modalTitle" class="text-2xl font-bold text-white">Nuevo Registro</h3>
            </div>
            <form id="modalForm" class="p-6" style="max-height: calc(100vh - 12rem); overflow-y: auto;">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Fecha -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Fecha *</label>
                        <input type="date" id="modalFecha" required
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>

                    <!-- Campos Arequipa -->
                    <div id="campoEmpresa">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Empresa</label>
                        <select id="modalEmpresa"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500"></select>
                    </div>
                    <div id="campoMercado">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Mercado</label>
                        <select id="modalMercado"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500"></select>
                    </div>
                    
                    <div id="campoCondicion">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Condición</label>
                        <select id="modalCondicion"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500"></select>
                    </div>

                    <!-- Campos Provincia -->
                    <div id="campoProvincia" style="display:none;">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Provincia</label>
                        <select id="modalProvincia"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500"></select>
                    </div>
                    <div id="campoTipo" style="display:none;">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Tipo</label>
                        <select id="modalTipo"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500"></select>
                    </div>

                    <!-- Proveedor -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Proveedor *</label>
                        <select id="modalProveedor" required
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500"></select>
                    </div>
                    

                    <!-- Precios -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Precio May. Mín</label>
                        <input type="number" id="modalPrecioMayMin" step="0.01"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Precio May. Máx</label>
                        <input type="number" id="modalPrecioMayMax" step="0.01"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Precio Púb. Mín</label>
                        <input type="number" id="modalPrecioPubMin" step="0.01"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Precio Púb. Máx</label>
                        <input type="number" id="modalPrecioPubMax" step="0.01"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>

                    <!-- Pesos -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Peso Macho Mín</label>
                        <input type="number" id="modalPesoMachoMin" step="0.1"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Peso Macho Máx</label>
                        <input type="number" id="modalPesoMachoMax" step="0.1"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Peso Hemb. Mín</label>
                        <input type="number" id="modalPesoHembMin" step="0.1"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Peso Hemb. Máx</label>
                        <input type="number" id="modalPesoHembMax" step="0.1"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>

                    <!-- Color -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Color Mín</label>
                        <input type="number" id="modalColorMin" step="0.1"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Color Máx</label>
                        <input type="number" id="modalColorMax" step="0.1"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>

                    <!-- Pesos Promedio -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Peso Prom. Macho Mín</label>
                        <input type="number" id="modalPesoMachoPromMin" step="0.1"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Peso Prom. Macho Máx</label>
                        <input type="number" id="modalPesoMachoPromMax" step="0.1"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Peso Prom. Hemb. Mín</label>
                        <input type="number" id="modalPesoHembraPromMin" step="0.1"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Peso Prom. Hemb. Máx</label>
                        <input type="number" id="modalPesoHembraPromMax" step="0.1"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>

                    <!-- Cantidad -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Cantidad *</label>
                        <input type="number" id="modalCantidad" required
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>
                </div>

                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" id="btnCancelar"
                        class="bg-gray-500 hover:bg-gray-600 text-white font-semibold py-2 px-6 rounded-lg">
                        Cancelar
                    </button>
                    <button type="button" id="btnGuardar"
                        class="bg-purple-500 hover:bg-purple-600 text-white font-semibold py-2 px-6 rounded-lg">
                        <i class="fas fa-save mr-2"></i>
                        Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Loading -->
    <div id="loading" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50"
        style="display: none;">
        <div class="bg-white p-6 rounded-xl shadow-2xl">
            <i class="fas fa-spinner fa-spin text-4xl text-purple-600 mb-2"></i>
            <p class="text-gray-700">Cargando...</p>
        </div>
    </div>

    <!-- Scripts -->
    <!-- jQuery (requerido por DataTables) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- DataTables CSS y JS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/2.0.8/css/dataTables.dataTables.min.css">
    <script src="https://cdn.datatables.net/2.0.8/js/dataTables.min.js"></script>
    
    <script src="js/config/config.js"></script>
    <script src="js/services/comercializacion.service.js"></script>
    <script src="js/controllers/comercializacion.controller.js"></script>

    <script>
        // Inicializar controlador al cargar la página
        document.addEventListener('DOMContentLoaded', () => {
            comercializacionController.init();
        });

        // Definir función global después de que el controlador ya existe
        window.cargarDatos = async function (tipo) {
            if (window.comercializacionController && typeof window.comercializacionController.cargarDatos === 'function') {
                await window.comercializacionController.cargarDatos(tipo);
            } else {
                console.error("comercializacionController.cargarDatos no está definido");
            }
        };
    </script>
<script src="js/utils/funcionesVarias.js"></script>
</body>

</html>
