<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Precio Vivo</title>

    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="css/dashboard-sstyles.css">

    <style>
        .dropdown-columns {
            position: relative;
            display: inline-block;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            background-color: white;
            min-width: 250px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            z-index: 1000;
            max-height: 400px;
            overflow-y: auto;
            margin-top: 8px;
        }

        .dropdown-content.show {
            display: block;
        }

        .column-toggle {
            padding: 12px 16px;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .column-toggle:hover {
            background-color: #f3f4f6;
        }

        .column-toggle input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .dropdown-header {
            padding: 12px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 600;
            border-radius: 8px 8px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #btnToggleFiltros {
            transition: transform 0.3s ease, background-color 0.2s ease;
        }

        #btnToggleFiltros:hover {
            background-color: rgba(139, 92, 246, 0.1);
        }

        #filterContent {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.3s ease, padding 0.3s ease;
        }

        #filterContent.show {
            max-height: 600px;
            opacity: 1;
            padding-top: 1rem;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50">
    <div class="container mx-auto px-4 py-6">

        <!-- Acciones -->
        <section class="bg-white rounded-2xl card-shadow p-4 mb-4 slide-down">
            <h2 class="text-xl font-bold text-gray-700 mb-4 flex items-center gap-2">
                <i class="fas fa-tools text-purple-600"></i>
                Acciones
            </h2>
            <div class="flex flex-wrap gap-3 items-center justify-between">
                <div class="flex flex-wrap gap-3">
                    <button id="btnNuevo"
                        class="bg-green-500 hover:bg-green-600 text-white font-semibold py-2 px-4 rounded-lg shadow btn-hover-scale">
                        <i class="fas fa-plus mr-2"></i>
                        Nuevo Registro
                    </button>
                    <button id="btnExportar"
                        class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg shadow btn-hover-scale">
                        <i class="fas fa-file-excel mr-2"></i>
                        Exportar Excel
                    </button>
                </div>

                <div class="dropdown-columns">
                    <button id="btnToggleColumns" 
                        class="bg-purple-500 hover:bg-purple-600 text-white font-semibold py-2 px-4 rounded-lg shadow btn-hover-scale flex items-center gap-2">
                        <i class="fas fa-columns"></i>
                        Mostrar/Ocultar columnas
                        <i class="fas fa-chevron-down text-sm"></i>
                    </button>
                    
                    <div id="columnDropdown" class="dropdown-content">
                        <div class="dropdown-header">
                            <span>Seleccionar Columnas</span>
                            <button id="btnCloseDropdown" class="text-white hover:text-gray-200">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                        <div class="p-2">
                            <label class="column-toggle">
                                <input type="checkbox" class="column-checkbox" data-column="0" checked>
                                <span>#</span>
                            </label>
                            <label class="column-toggle">
                                <input type="checkbox" class="column-checkbox" data-column="1" checked>
                                <span>Fecha</span>
                            </label>
                            <label class="column-toggle">
                                <input type="checkbox" class="column-checkbox" data-column="2" checked>
                                <span>Empresa</span>
                            </label>
                            <label class="column-toggle">
                                <input type="checkbox" class="column-checkbox" data-column="3" checked>
                                <span>C.Acopio Min</span>
                            </label>
                            <label class="column-toggle">
                                <input type="checkbox" class="column-checkbox" data-column="4" checked>
                                <span>C.Acopio Max</span>
                            </label>
                            <label class="column-toggle">
                                <input type="checkbox" class="column-checkbox" data-column="5" checked>
                                <span>May.Rep Min</span>
                            </label>
                            <label class="column-toggle">
                                <input type="checkbox" class="column-checkbox" data-column="6" checked>
                                <span>May.Rep Max</span>
                            </label>
                            <label class="column-toggle">
                                <input type="checkbox" class="column-checkbox" data-column="7" checked>
                                <span>Pub Min</span>
                            </label>
                            <label class="column-toggle">
                                <input type="checkbox" class="column-checkbox" data-column="8" checked>
                                <span>Pub Max</span>
                            </label>
                            <label class="column-toggle">
                                <input type="checkbox" class="column-checkbox" data-column="9" checked disabled>
                                <span>Opciones (siempre visible)</span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Filtros -->
        <section id="filterSection" class="bg-white rounded-2xl card-shadow p-6 mb-6 slide-down">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-bold text-gray-700 flex items-center gap-2">
                    <i class="fas fa-sliders-h text-purple-600"></i>
                    Filtros
                </h2>
                <button id="btnToggleFiltros" class="text-gray-500 hover:text-purple-600 transition">
                    <i class="fas fa-chevron-up"></i>
                </button>
                <button id="btnLimpiarFiltros" class="text-purple-600 hover:text-purple-700 font-semibold">
                    <i class="fas fa-times-circle mr-1"></i>
                    Limpiar filtros
                </button>
            </div>
            <div id="filterContent" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-calendar-alt mr-1 text-purple-600"></i>
                        Fecha Inicio
                    </label>
                    <input type="date" id="filterFechaInicio"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-calendar-alt mr-1 text-purple-600"></i>
                        Fecha Fin
                    </label>
                    <input type="date" id="filterFechaFin"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-building mr-1 text-purple-600"></i>
                        Empresa
                    </label>
                    <select id="filterEmpresa"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                        <option value="">Todas las empresas</option>
                    </select>
                </div>
            </div>
        </section>

        <!-- Tabla -->
        <section class="bg-white rounded-2xl card-shadow p-6 slide-down">
            <h2 class="text-xl font-bold text-gray-700 mb-4 flex items-center gap-2">
                <i class="fas fa-table text-purple-600"></i>
                Registros de Precio Vivo
            </h2>
            <div class="table-scroll">
                <table class="min-w-full">
                    <thead class="bg-gradient-to-r from-blue-600 to-blue-700 text-white sticky top-0">
                        <tr>
                            <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider w-12">#</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider">FECHA</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider">EMPRESA</th>
                            <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider">C.ACOPIO
                                MIN</th>
                            <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider">C.ACOPIO
                                MAX</th>
                            <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider">MAY.REP MIN
                            </th>
                            <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider">MAY.REP MAX
                            </th>
                            <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider">PUB MIN
                            </th>
                            <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider">PUB MAX
                            </th>
                            <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider">OPCIONES
                            </th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="10" class="text-center py-8 text-gray-500">Cargando datos...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- Modal -->
    <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 p-4"
        style="display: none; overflow-y: auto;">
        <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full my-8">
            <div class="bg-gradient-to-r from-purple-500 to-indigo-600 p-6 rounded-t-2xl">
                <h3 id="modalTitle" class="text-2xl font-bold text-white">Nuevo Registro</h3>
            </div>
            <form id="modalForm" class="p-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Fecha *</label>
                        <input type="date" id="modalFecha" required
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Empresa *</label>
                        <select id="modalEmpresa" required
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                            <option value="">Seleccionar...</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Precio Mín Centro Acopio</label>
                        <input type="number" id="modalPrecioMinCentroAcopio" step="0.01"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Precio Máx Centro Acopio</label>
                        <input type="number" id="modalPrecioMaxCentroAcopio" step="0.01"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Precio Mín Mayorista Reparto</label>
                        <input type="number" id="modalPrecioMinMayoristaReparto" step="0.01"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Precio Máx Mayorista Reparto</label>
                        <input type="number" id="modalPrecioMaxMayoristaReparto" step="0.01"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Precio Público Mín</label>
                        <input type="number" id="modalPrecioPubMin" step="0.01"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Precio Público Máx</label>
                        <input type="number" id="modalPrecioPubMax" step="0.01"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>
                </div>

                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" id="btnCancelar"
                        class="bg-gray-500 hover:bg-gray-600 text-white font-semibold py-2 px-6 rounded-lg">
                        Cancelar
                    </button>
                    <button type="button" id="btnGuardar"
                        class="bg-purple-500 hover:bg-purple-600 text-white font-semibold py-2 px-6 rounded-lg">
                        <i class="fas fa-save mr-2"></i>
                        Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Loading -->
    <div id="loading" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50"
        style="display: none;">
        <div class="bg-white p-6 rounded-xl shadow-2xl">
            <i class="fas fa-spinner fa-spin text-4xl text-purple-600 mb-2"></i>
            <p class="text-gray-700">Cargando...</p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/2.0.8/css/dataTables.dataTables.min.css">
    <script src="https://cdn.datatables.net/2.0.8/js/dataTables.min.js"></script>

    <script src="js/config/config.js"></script>
    <script src="js/config/config.precioVivo.js"></script>
    <script src="js/services/precio-vivo.service.js"></script>
    <script src="js/controllers/precio-vivo.controller.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 DOM Cargado, inicializando Precio Vivo controller...');

            // Verificar que los scripts se cargaron
            if (typeof PrecioVivoConfig === 'undefined') {
                console.error('❌ PrecioVivoConfig no cargado');
                return;
            }
            console.log('✅ Config cargado:', PrecioVivoConfig);

            if (typeof PrecioVivoService === 'undefined') {
                console.error('❌ PrecioVivoService no cargado');
                return;
            }
            console.log('✅ Service cargado');

            if (typeof PrecioVivoController === 'undefined') {
                console.error('❌ PrecioVivoController no cargado');
                return;
            }
            console.log('✅ Controller cargado');

            console.log('✅ Todos los scripts de Precio Vivo cargados correctamente');

            // Inicializar el controller
            if (window.precioVivoController) {
                console.log('🎯 Inicializando precioVivoController...');
                window.precioVivoController.init();
            } else {
                console.error('❌ precioVivoController no está disponible en window');
            }
        });
    </script>
    <script src="js/utils/funcionesVarias.js"></script>
</body>

</html>
