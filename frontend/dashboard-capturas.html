<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de Gestión de Pollo - Dashboard administrativo">
    <title>Dashboard - Gestión</title>

      <!-- Tailwind CSS -->
    <link rel="stylesheet" href="css/output.css">

    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    <!-- Estilos personalizados -->
      <link rel="stylesheet" href="css/dashboard-responsive.css">
    <style>
        /* Scrollbar personalizado */
        .table-scroll {
            max-height: 500px;
            overflow-y: auto;
        }

        .table-scroll::-webkit-scrollbar,
        .modal-content-scroll::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        .table-scroll::-webkit-scrollbar-track,
        .modal-content-scroll::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        .table-scroll::-webkit-scrollbar-thumb,
        .modal-content-scroll::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }

        .table-scroll::-webkit-scrollbar-thumb:hover,
        .modal-content-scroll::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 50;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.3s ease;
        }

        .modal.show {
            display: block;
        }

        .modal-content-scroll {
            max-height: 70vh;
            overflow-y: auto;
        }

        /* Animaciones */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .slide-down {
            animation: slideDown 0.4s ease;
        }

        /* Mejoras visuales */
        .card-shadow {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .btn-hover-scale {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-hover-scale:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 400px;
        }

        .toast {
            background: white;
            border-radius: 12px;
            padding: 16px 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideInRight 0.3s ease;
            min-width: 300px;
        }

        .toast.closing {
            animation: slideOutRight 0.3s ease;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(400px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideOutRight {
            from {
                transform: translateX(0);
                opacity: 1;
            }

            to {
                transform: translateX(400px);
                opacity: 0;
            }
        }

        .toast-success {
            border-left: 4px solid #10b981;
        }

        .toast-error {
            border-left: 4px solid #ef4444;
        }

        .toast-warning {
            border-left: 4px solid #f59e0b;
        }

        .toast-info {
            border-left: 4px solid #3b82f6;
        }

        .toast-icon {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
        }

        .toast-content {
            flex: 1;
        }

        .toast-title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 2px;
        }

        .toast-message {
            font-size: 13px;
            color: #6b7280;
        }

        .toast-close {
            cursor: pointer;
            color: #9ca3af;
            transition: color 0.2s;
            padding: 4px;
        }

        .toast-close:hover {
            color: #4b5563;
        }

        /* Estilos para el dropdown de columnas */
        .dropdown-columns {
            position: relative;
            display: inline-block;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            background-color: white;
            min-width: 320px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            border-radius: 12px;
            z-index: 1000;
            max-height: 500px;
            overflow-y: auto;
            margin-top: 8px;
            border: 1px solid #e5e7eb;
        }

        .dropdown-content.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        .column-toggle {
            padding: 12px 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #f3f4f6;
        }

        .column-toggle:last-child {
            border-bottom: none;
        }

        .column-toggle:hover {
            background-color: #f9fafb;
        }

        .column-toggle input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #8b5cf6;
            border-radius: 4px;
        }

        .column-toggle input[type="checkbox"]:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .column-toggle span {
            flex: 1;
            font-size: 14px;
            color: #374151;
            font-weight: 500;
        }

        .dropdown-header {
            padding: 16px;
            background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
            color: white;
            font-weight: 600;
            border-radius: 12px 12px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(139, 92, 246, 0.3);
        }

        /* Scrollbar personalizado para el dropdown */
        .dropdown-content::-webkit-scrollbar {
            width: 6px;
        }

        .dropdown-content::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .dropdown-content::-webkit-scrollbar-thumb {
            background: #8b5cf6;
            border-radius: 10px;
        }

        .dropdown-content::-webkit-scrollbar-thumb:hover {
            background: #7c3aed;
        }

        #btnToggleFiltros {
            transition: transform 0.3s ease, background-color 0.2s ease;
        }

        #btnToggleFiltros:hover {
            background-color: rgba(139, 92, 246, 0.1);
        }

        #filterContent {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.3s ease, padding 0.3s ease;
        }

        #filterContent.show {
            max-height: 600px;
            opacity: 1;
            padding-top: 1rem;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50 min-h-screen">

        <!-- Main Content -->

                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>

                        </button>
                        
                        <div id="columnDropdown" class="dropdown-content">
                            <div class="dropdown-header">

            <!-- Filtros -->

                <div class="flex items-center justify-between mb-4">

                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"

                    </div>
                    <div>

                    <div>

                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition">
                            <option value="">Todas</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Tipo Cliente</label>
                        <select id="filterTipoCliente" onchange="aplicarFiltros()"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition">
                            <option value="">Todos</option>
                        </select>
                    </div>
                </div>
                <div class="mt-4 text-sm text-gray-600 flex items-center gap-2">

                            d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>

    <!-- Modal de formulario -->
    <div id="formModal" class="modal">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-2xl shadow-2xl max-w-6xl w-full slide-down">
                <div
                    class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white px-6 py-4 rounded-t-2xl flex justify-between items-center">
                    <h3 id="modalTitle" class="text-2xl font-bold">Formulario</h3>
                    <button onclick="cerrarModal()"
                        class="text-white hover:text-gray-200 text-3xl font-bold transition-transform hover:scale-110">
                        &times;
                    </button>
                </div>
                <div class="modal-content-scroll px-6 py-4">
                    <form id="registroForm"></form>
                </div>
                <div class="bg-gray-50 px-6 py-4 rounded-b-2xl flex justify-end gap-3">
                    <button type="button" onclick="cerrarModal()"
                        class="bg-gray-500 hover:bg-gray-600 text-white font-semibold py-2.5 px-6 rounded-lg transition btn-hover-scale">
                        Cancelar
                    </button>
                    <button type="button" onclick="guardarRegistro()"
                        class="bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white font-semibold py-2.5 px-6 rounded-lg transition btn-hover-scale">
                        Guardar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <script>
        window.cargarDatos = async function (tipo) {
            if (window.capturasController && typeof window.capturasController.cargarDatos === 'function') {
                await window.capturasController.cargarDatos(tipo);
            } else {
                console.error("capturasController.cargarDatos no está definido");
            }
        };
        document.getElementById('year').textContent = new Date().getFullYear();

        // Toggle filtros
        const toggleBtn = document.getElementById('btnToggleFiltros');
        const filterContent = document.getElementById('filterContent');
        
        if (toggleBtn && filterContent) {
            //filterContent.classList.add('show');
            
            toggleBtn.addEventListener('click', () => {
                const isOpen = filterContent.classList.contains('show');
                const icon = toggleBtn.querySelector('i');
                
                if (isOpen) {
                    filterContent.classList.remove('show');
                    icon.classList.remove('fa-chevron-up');
                    icon.classList.add('fa-chevron-down');
                } else {
                    filterContent.classList.add('show');
                    icon.classList.remove('fa-chevron-down');
                    icon.classList.add('fa-chevron-up');
                }
            });
        }
    </script>

</body>
