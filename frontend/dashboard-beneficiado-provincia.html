<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Beneficio Provincia</title>

    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        .table-scroll {
            max-height: calc(100vh - 450px);
            min-height: 650px;
            overflow-y: auto;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
        }

        .table-scroll table {
            border-collapse: separate;
            border-spacing: 0;
        }

        .table-scroll th {
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .table-scroll th,
        .table-scroll td {
            border-bottom: 1px solid #e5e7eb;
            white-space: nowrap;
        }

        .table-scroll tbody tr:hover {
            background-color: #f8fafc;
        }

        .filter-group {
            border-radius: 0.5rem;
            padding: 1rem;
            background-color: #f8fafc;
        }

        .card-shadow {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .btn-hover-scale {
            transition: transform 0.2s ease;
        }

        .btn-hover-scale:hover {
            transform: translateY(-2px);
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .slide-down {
            animation: slideDown 0.4s ease;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100%);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideOutRight {
            from {
                opacity: 1;
                transform: translateX(0);
            }

            to {
                opacity: 0;
                transform: translateX(100%);
            }
        }
    </style>
</head>

<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50">
    <div class="container mx-auto px-4 py-6">

        <!-- Filtros -->
        <section id="filterSection" class="bg-white rounded-2xl card-shadow p-6 mb-6 slide-down">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-bold text-gray-700 flex items-center gap-2">
                    <i class="fas fa-sliders-h text-purple-600"></i>
                    Filtros
                </h2>
                <button id="btnLimpiarFiltros" class="text-purple-600 hover:text-purple-700 font-semibold">
                    <i class="fas fa-times-circle mr-1"></i>
                    Limpiar filtros
                </button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-calendar-alt mr-1 text-purple-600"></i>
                        Fecha Inicio
                    </label>
                    <input type="date" id="filterFechaInicio"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-calendar-alt mr-1 text-purple-600"></i>
                        Fecha Fin
                    </label>
                    <input type="date" id="filterFechaFin"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-map-marker-alt mr-1 text-purple-600"></i>
                        Provincia
                    </label>
                    <select id="filterProvincia"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                        <option value="">Todas las provincias</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-user mr-1 text-purple-600"></i>
                        Proveedor
                    </label>
                    <select id="filterProveedor"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                        <option value="">Todos los proveedores</option>
                    </select>
                </div>
            </div>
        </section>

        <!-- Acciones -->
        <section class="bg-white rounded-2xl card-shadow p-4 mb-4 slide-down">
            <h2 class="text-xl font-bold text-gray-700 mb-4 flex items-center gap-2">
                <i class="fas fa-tools text-purple-600"></i>
                Acciones
            </h2>
            <div class="flex flex-wrap gap-3">
                <button id="btnNuevo"
                    class="bg-green-500 hover:bg-green-600 text-white font-semibold py-2 px-4 rounded-lg shadow btn-hover-scale">
                    <i class="fas fa-plus mr-2"></i>
                    Nuevo Registro
                </button>
                <button id="btnExportar"
                    class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg shadow btn-hover-scale">
                    <i class="fas fa-file-excel mr-2"></i>
                    Exportar Excel
                </button>
            </div>
        </section>

        <!-- Tabla -->
        <section class="bg-white rounded-2xl card-shadow p-6 slide-down">
            <h2 class="text-xl font-bold text-gray-700 mb-4 flex items-center gap-2">
                <i class="fas fa-table text-purple-600"></i>
                Registros de Beneficio Provincia
            </h2>
            <div class="table-scroll">
                <table class="min-w-full">
                   <thead class="bg-gradient-to-r from-blue-600 to-blue-700 text-white sticky top-0">
    <tr>
        <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider w-12">#</th>
        <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider">FECHA</th>
        <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider">PROVINCIA</th>
        <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider">PROVEEDOR</th>
        <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider">P.MAY ENTERO</th>
        <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider">P.MAY MEJORADO</th>
        <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider">P.MAY CARCASA</th>
        <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider">P.PUB MEJORADO</th>
        <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider">P.PUB CARCASA</th>
        <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider">PESO PROM MIN</th>
        <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider">PESO PROM MAX</th>
        <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider">COLOR MIN</th>
        <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider">COLOR MAX</th>
        <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider">CANTIDAD</th>
        <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider">OPCIONES</th>
    </tr>
</thead>

                    <tbody id="tableBody">
                        <tr>
                            <td colspan="14" class="text-center py-8 text-gray-500">Cargando datos...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- Modal -->
    <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 p-4"
        style="display: none; overflow-y: auto;">
        <div class="bg-white rounded-2xl shadow-2xl max-w-4xl w-full my-8" style="max-height: calc(100vh - 4rem);">
            <div class="bg-gradient-to-r from-purple-500 to-indigo-600 p-6 rounded-t-2xl sticky top-0 z-10">
                <h3 id="modalTitle" class="text-2xl font-bold text-white">Nuevo Registro</h3>
            </div>
            <form id="modalForm" class="p-6" style="max-height: calc(100vh - 12rem); overflow-y: auto;">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Fecha -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Fecha *</label>
                        <input type="date" id="modalFecha" required
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>

                    <!-- Provincia -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Provincia *</label>
                        <select id="modalProvincia" required
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                        </select>
                    </div>

                    <!-- Proveedor -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Proveedor *</label>
                        <select id="modalProveedor" required
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                        </select>
                    </div>

                    <!-- Precios Mayorista -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Precio May. Entero</label>
                        <input type="number" id="modalPrecioMayEntero" step="0.01"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Precio May. Mejorado</label>
                        <input type="number" id="modalPrecioMayMejorado" step="0.01"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Precio May. Carcasa</label>
                        <input type="number" id="modalPrecioMayCarcasa" step="0.01"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>

                    <!-- Precios Público -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Precio Púb. Mejorado</label>
                        <input type="number" id="modalPrecioPubMejorado" step="0.01"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Precio Púb. Carcasa</label>
                        <input type="number" id="modalPrecioPubCarcasa" step="0.01"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>

                    <!-- Pesos Promedio -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Peso Prom. Menor</label>
                        <input type="number" id="modalPesoPromMenor" step="0.1"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Peso Prom. Mayor</label>
                        <input type="number" id="modalPesoPromMayor" step="0.1"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>

                    <!-- Color -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Color Mín</label>
                        <input type="number" id="modalColorMin" step="0.1"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Color Máx</label>
                        <input type="number" id="modalColorMax" step="0.1"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>

                    <!-- Cantidad -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Cantidad *</label>
                        <input type="number" id="modalCantidad" required
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>
                </div>

                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" id="btnCancelar"
                        class="bg-gray-500 hover:bg-gray-600 text-white font-semibold py-2 px-6 rounded-lg">
                        Cancelar
                    </button>
                    <button type="button" id="btnGuardar"
                        class="bg-purple-500 hover:bg-purple-600 text-white font-semibold py-2 px-6 rounded-lg">
                        <i class="fas fa-save mr-2"></i>
                        Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Loading -->
    <div id="loading" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50"
        style="display: none;">
        <div class="bg-white p-6 rounded-xl shadow-2xl">
            <i class="fas fa-spinner fa-spin text-4xl text-purple-600 mb-2"></i>
            <p class="text-gray-700">Cargando...</p>
        </div>
    </div>

    <!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<link rel="stylesheet" href="https://cdn.datatables.net/2.0.8/css/dataTables.dataTables.min.css">
<script src="https://cdn.datatables.net/2.0.8/js/dataTables.min.js"></script>

<!-- Configuraciones -->
<script src="js/config/constants.js"></script>
<script src="js/config/config.beneficioProvincia.js"></script>

<!-- Servicios y Controladores -->
<script src="js/services/beneficiadoProvincia.service.js"></script>
<script src="js/controllers/beneficiadoProvincia.controller.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        console.log('🚀 DOM Cargado, inicializando controller...');
        
        // Verificar que los scripts se cargaron
        if (typeof BeneficioProvinciaConfig === 'undefined') {
            console.error('❌ Config no cargado');
            return;
        }
        if (typeof BeneficioProvinciaService === 'undefined') {
            console.error('❌ Service no cargado');
            return;
        }
        if (typeof BeneficioProvinciaController === 'undefined') {
            console.error('❌ Controller no cargado');
            return;
        }
        
        console.log('✅ Todos los scripts cargados correctamente');
        
        // Inicializar el controller
        if (window.beneficioProvinciaController) {
            window.beneficioProvinciaController.init();
        } else {
            console.error('❌ beneficioProvinciaController no está disponible');
        }
    });
</script>


</body>

</html>
