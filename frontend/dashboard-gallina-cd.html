<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

    <style>
        .dropdown-columns {
            position: relative;
            display: inline-block;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            background-color: white;
            min-width: 350px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            z-index: 1000;
            max-height: 500px;
            overflow-y: auto;
        }

        .dropdown-content.show {
            display: block;
        }

        .column-toggle {
            padding: 12px 16px;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .column-toggle:hover {
            background-color: #f3f4f6;
        }

        .column-toggle input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .dropdown-header {
            padding: 12px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 600;
            border-radius: 8px 8px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #btnToggleFiltros {
            transition: transform 0.3s ease, background-color 0.2s ease;
        }

        #btnToggleFiltros:hover {
            background-color: rgba(139, 92, 246, 0.1);
        }

        #filterContent {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.3s ease, padding 0.3s ease;
        }

        #filterContent.show {
            max-height: 600px;
            opacity: 1;
            padding-top: 1rem;
        }

        /* Estilos para tabla responsive */
.dataTables_wrapper {
    width: 100% !important;
    overflow-x: auto;
}

.dataTables_wrapper .dataTables_length {
    margin-bottom: 1rem;
}

.dataTables_wrapper .dataTables_filter {
    margin-bottom: 1rem;
}

.dataTables_wrapper .dataTables_info {
    margin-top: 1rem;
}

.dataTables_wrapper .dataTables_paginate {
    margin-top: 1rem;
    display: flex;
    justify-content: flex-end;
}

/* Ajustar ancho de columnas */
#dataTable {
    table-layout: auto;
    width: 100%;
    min-width: 1400px; /* Ancho mínimo para todas las columnas */
}

#dataTable th,
#dataTable td {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* Columnas de precios más estrechas */
#dataTable th:nth-child(n+7):nth-child(-n+16),
#dataTable td:nth-child(n+7):nth-child(-n+16) {
    min-width: 80px;
    max-width: 100px;
}

/* Columna ID */
#dataTable th:first-child,
#dataTable td:first-child {
    min-width: 100px;
    max-width: 120px;
}

/* Columna Fecha */
#dataTable th:nth-child(2),
#dataTable td:nth-child(2) {
    min-width: 100px;
}

/* Columna Tipo */
#dataTable th:nth-child(3),
#dataTable td:nth-child(3) {
    min-width: 150px;
}

/* Columnas numéricas */
#dataTable th:nth-child(4),
#dataTable td:nth-child(4),
#dataTable th:nth-child(5),
#dataTable td:nth-child(5),
#dataTable th:nth-child(6),
#dataTable td:nth-child(6) {
    min-width: 80px;
}

/* Columna Opciones */
#dataTable th:last-child,
#dataTable td:last-child {
    min-width: 120px;
    position: sticky;
    right: 0;
    background-color: white;
    z-index: 1;
}

/* Sombra para columnas sticky */
#dataTable td:last-child {
    box-shadow: -2px 0 5px rgba(0, 0, 0, 0.1);
}

/* Responsive para DataTables */
@media (max-width: 1024px) {
    .dataTables_wrapper .dataTables_length,
    .dataTables_wrapper .dataTables_filter {
        width: 100%;
        text-align: left;
    }
    
    .dataTables_wrapper .dataTables_paginate {
        width: 100%;
        justify-content: center;
    }
}

/* Mejorar scroll horizontal */
.overflow-x-auto::-webkit-scrollbar {
    height: 8px;
}

.overflow-x-auto::-webkit-scrollbar-track {
    background: #f1f1f1;
    border-radius: 10px;
}

.overflow-x-auto::-webkit-scrollbar-thumb {
    background: #888;
    border-radius: 10px;
}

.overflow-x-auto::-webkit-scrollbar-thumb:hover {
    background: #555;
}

    </style>
</head>

<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50">

        <section id="filterSection" class="bg-white rounded-2xl card-shadow p-6 mb-6 slide-down">
