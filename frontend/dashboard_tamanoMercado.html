<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Información del Mercado</title>

    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<link rel="stylesheet" href="css/dashboard-sstyles.css">
</head>

<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50">
    <div class="container mx-auto px-4 py-6">

        <!-- Filtros -->
        <section id="filterSection" class="bg-white rounded-2xl card-shadow p-6 mb-6 slide-down">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-bold text-gray-700 flex items-center gap-2">
                    <i class="fas fa-sliders-h text-purple-600"></i>
                    Filtros
                </h2>
                <button id="btnLimpiarFiltros" class="text-purple-600 hover:text-purple-700 font-semibold">
                    <i class="fas fa-times-circle mr-1"></i>
                    Limpiar filtros
                </button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <!-- Filtros principales siempre visibles -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-calendar-alt mr-1 text-purple-600"></i>
                        Fecha Inicio
                    </label>
                    <input type="date" id="filterFechaInicio"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-calendar-alt mr-1 text-purple-600"></i>
                        Fecha Fin
                    </label>
                    <input type="date" id="filterFechaFin"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                </div>
                <div class="">
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-tag mr-1 text-purple-600"></i>
                        Tipo
                    </label>
                    <select id="filterTipoPollo"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                        <option value="">Todos los tipos</option>
                    </select>
                </div>
                <div class="">
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-tag mr-1 text-purple-600"></i>
                        Linea
                    </label>
                    <select id="filterTipoLinea"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                        <option value="">Todos las lineas</option>
                    </select>
                </div>
                <div class="">
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-map-marker-alt mr-1 text-purple-600"></i>
                        Provincia
                    </label>
                    <select id="filterProvincia"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                        <option value="">Todas las provincias</option>
                    </select>
                </div>
                <div class="">
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-map-marker-alt mr-1 text-purple-600"></i>
                        Zona
                    </label>
                    <select id="filterZona"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                        <option value="">Todas las zonas</option>
                    </select>
                </div>
                <div class="">
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-map-marker-alt mr-1 text-purple-600"></i>
                        Empresa
                    </label>
                    <select id="filterEmpresa"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                        <option value="">Todas las empresas</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-user mr-1 text-purple-600"></i>
                        Proveedor
                    </label>
                    <select id="filterProveedor"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                        <option value="">Todos los proveedores</option>
                    </select>
                </div>
                <div class="">
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-map-marker-alt mr-1 text-purple-600"></i>
                        Producto
                    </label>
                    <select id="filterProducto"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                        <option value="">Todas los productos</option>
                    </select>
                </div>
                          
                
            </div>
        </section>

        <!-- Acciones -->
        <section class="bg-white rounded-2xl card-shadow p-4 mb-4 slide-down">
            <h2 class="text-xl font-bold text-gray-700 mb-4 flex items-center gap-2">
                <i class="fas fa-tools text-purple-600"></i>
                Acciones
            </h2>
            <div class="flex flex-wrap gap-3">
                <button id="btnNuevo"
                    class="bg-green-500 hover:bg-green-600 text-white font-semibold py-2 px-4 rounded-lg shadow btn-hover-scale">
                    <i class="fas fa-plus mr-2"></i>
                    Nuevo Registro
                </button>
                <button id="btnExportar"
                    class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg shadow btn-hover-scale">
                    <i class="fas fa-file-excel mr-2"></i>
                    Exportar Excel
                </button>
            </div>
        </section>

        <!-- Tabla -->
        <section class="bg-white rounded-2xl card-shadow p-6 slide-down">
            <h2 class="text-xl font-bold text-gray-700 mb-4 flex items-center gap-2">
                <i class="fas fa-table text-purple-600"></i>
                Registros
            </h2>
            <div class="table-scroll">
                <table class="min-w-full">
                    <thead class="bg-gradient-to-r from-blue-600 to-blue-700 text-white sticky top-0">
                        <tr>
                            <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider w-12">#</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider">FECHA</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider">MERCADO</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider">EMPRESA</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider">RUC.EMPR</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider">CONDICION
                            </th>
                            <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider">PROVEEDOR
                            </th>
                            <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider">RUC.PROVE
                            </th>
                            <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider">COND/TIPO
                            </th>
                            <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider">P.MAYOR
                            </th>
                            <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider">P.PÚBLICO
                            </th>
                            <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider">PESOS</th>
                            <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider">PROM.PESO
                            </th>
                            <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider">COLOR</th>
                            <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider w-20">CANT.
                            </th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="8" class="text-center py-8 text-gray-500">Selecciona un tipo de datos para
                                comenzar</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- Modal -->
    <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 p-4"
        style="display: none; overflow-y: auto;">
        <div class="bg-white rounded-2xl shadow-2xl max-w-4xl w-full my-8" style="max-height: calc(100vh - 4rem);">
            <div class="bg-gradient-to-r from-purple-500 to-indigo-600 p-6 rounded-t-2xl sticky top-0 z-10">
                <h3 id="modalTitle" class="text-2xl font-bold text-white">Nuevo Registro</h3>
            </div>
            <form id="modalForm" class="p-6" style="max-height: calc(100vh - 12rem); overflow-y: auto;">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Fecha -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Fecha *</label>
                        <input type="date" id="modalFecha" required
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>

                    <!-- Campos select -->
                    <div id="campoTipoTipoPollo">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Tipo</label>
                        <select id="modalTipoPollo"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500"></select>
                    </div>
                    <div id="campoLinea">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Linea</label>
                        <select id="modalTipo"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500"></select>
                    </div>
                    <div id="campoProvincia">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Provincia</label>
                        <select id="modalProvincia"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500"></select>
                    </div>
                    <div id="campoZona">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Zona</label>
                        <select id="modalZona"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500"></select>
                    </div>

                    <!--  -->
                    <div id="campoEmpresa" >
                        <label class="block text-sm font-medium text-gray-700 mb-1">Empresa</label>
                        <select id="modalEmpresa"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500"></select>
                    </div>
                    <div id="campoProveedor">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Proveedor</label>
                        <select id="modalProveedor"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500"></select>
                    </div>

                    <!-- Proveedor -->
                    <div id="campoProducto">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Producto</label>
                        <select id="modalTipoPolloVivo" required
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500"></select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Cantidad</label>
                        <input type="text" id="modalCantidad" maxlength="11"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>

                    <!-- Precios -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Peso</label>
                        <input type="number" id="modalPeso" step="0.01"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Promedio</label>
                        <input type="number" id="modalPromedio" step="0.01"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Precio</label>
                        <input type="number" id="modalPrecio" step="0.01"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>
                      
                </div>

                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" id="btnCancelar"
                        class="bg-gray-500 hover:bg-gray-600 text-white font-semibold py-2 px-6 rounded-lg">
                        Cancelar
                    </button>
                    <button type="button" id="btnGuardar"
                        class="bg-purple-500 hover:bg-purple-600 text-white font-semibold py-2 px-6 rounded-lg">
                        <i class="fas fa-save mr-2"></i>
                        Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Loading -->
    <div id="loading" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50"
        style="display: none;">
        <div class="bg-white p-6 rounded-xl shadow-2xl">
            <i class="fas fa-spinner fa-spin text-4xl text-purple-600 mb-2"></i>
            <p class="text-gray-700">Cargando...</p>
        </div>
    </div>

    <!-- Scripts -->
    <!-- jQuery (requerido por DataTables) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- DataTables CSS y JS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/2.0.8/css/dataTables.dataTables.min.css">
    <script src="https://cdn.datatables.net/2.0.8/js/dataTables.min.js"></script>

    <!-- Scripts DE CONFIGURACION IMPORTANTE EL ORDEN -->
    <script src="js/config/config.js"></script>
    <script src="js/services/tamanoMercado.service.js"></script>
    <script src="js/controllers/tamanoMercado.controller.js"></script>

    <script>
        // Inicializar controlador al cargar la página
        document.addEventListener('DOMContentLoaded', () => {
            tamanoMercadoController.init();
        });

        // Definir función global después de que el controlador ya existe
        window.cargarDatos = async function () {
            if (window.tamanoMercadoController && typeof window.tamanoMercadoController.cargarDatos === 'function') {
                await window.tamanoMercadoController.cargarDatos();
            } else {
                console.error("tamanoMercadoController.cargarDatos no está definido");
            }
        };
    </script>

</body>

</html>
