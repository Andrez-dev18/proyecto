<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Test Conexión Simple</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1e1e1e;
            color: #00ff00;
        }
        .test { margin: 10px 0; padding: 10px; border: 1px solid #333; }
        .ok { background: #004400; }
        .error { background: #440000; color: #ff0000; }
        button { background: #0080ff; color: white; padding: 10px 20px; margin: 5px; border: none; cursor: pointer; }
        pre { background: #000; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔍 Diagnóstico de Conexión API</h1>
    
    <div>
        <button onclick="testURL()">1. Test URL Base</button>
        <button onclick="testEmpresas()">2. Test Empresas</button>
        <button onclick="testMercados()">3. Test Mercados</button>
        <button onclick="testProveedores()">4. Test Proveedores</button>
        <button onclick="testProvincias()">5. Test Provincias</button>
        <button onclick="testCondiciones()">6. Test Condiciones</button>
        <button onclick="testTipos()">7. Test Tipos</button>
        <button onclick="testVivoAqp()">8. Test Vivo Arequipa</button>
        <button onclick="testVivoProvincia()">9. Test Vivo Provincia</button>
        <button onclick="testAll()">🚀 Probar Todo</button>
    </div>
    
    <div id="results"></div>
    
    <script>
        const BASE_URL = 'http://localhost:8033/proyecto/backend';
        
        function log(msg, isError = false) {
            const div = document.createElement('div');
            div.className = 'test ' + (isError ? 'error' : 'ok');
            div.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong> ${msg}`;
            document.getElementById('results').appendChild(div);
        }
        
        async function testEndpoint(name, url) {
            log(`Testing ${name}: ${url}`);
            
            try {
                const response = await fetch(url);
                const text = await response.text();
                
                log(`✅ ${name} - Status: ${response.status}`, false);
                log(`Content-Type: ${response.headers.get('Content-Type')}`, false);
                log(`Response Length: ${text.length} bytes`, false);
                
                try {
                    const json = JSON.parse(text);
                    log(`✅ JSON válido - Registros: ${Array.isArray(json) ? json.length : 'N/A'}`, false);
                    log(`<pre>${JSON.stringify(json, null, 2).substring(0, 500)}...</pre>`, false);
                } catch (e) {
                    log(`⚠️ No es JSON válido. Response: <pre>${text.substring(0, 500)}</pre>`, true);
                }
                
            } catch (error) {
                log(`❌ ${name} FALLÓ: ${error.message}`, true);
            }
            
            log('---', false);
        }
        
        function testURL() {
            log(`URL Base configurada: ${BASE_URL}`, false);
            log(`Origen actual: ${window.location.origin}`, false);
        }
        
        async function testEmpresas() {
            await testEndpoint('Empresas', `${BASE_URL}/empresa/all`);
        }
        
        async function testMercados() {
            await testEndpoint('Mercados', `${BASE_URL}/mercado/all`);
        }
        
        async function testProveedores() {
            await testEndpoint('Proveedores', `${BASE_URL}/proveedor/all`);
        }
        
        async function testProvincias() {
            await testEndpoint('Provincias', `${BASE_URL}/provincia/all`);
        }
        
        async function testCondiciones() {
            await testEndpoint('Condiciones', `${BASE_URL}/comercializacion/condiciones`);
        }
        
        async function testTipos() {
            await testEndpoint('Tipos', `${BASE_URL}/comercializacion/tipos`);
        }
        
        async function testVivoAqp() {
            await testEndpoint('Vivo Arequipa', `${BASE_URL}/comercializacion/vivo-aqp`);
        }
        
        async function testVivoProvincia() {
            await testEndpoint('Vivo Provincia', `${BASE_URL}/comercializacion/vivo-provincia`);
        }
        
        async function testAll() {
            document.getElementById('results').innerHTML = '';
            log('🚀 Iniciando prueba completa...', false);
            
            testURL();
            await testEmpresas();
            await testMercados();
            await testProveedores();
            await testProvincias();
            await testCondiciones();
            await testTipos();
            await testVivoAqp();
            await testVivoProvincia();
            
            log('✅ Pruebas completadas', false);
        }
    </script>
</body>
</html>
