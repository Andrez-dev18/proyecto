<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Clientes Procesados</title>
    
     <!-- ... -->
    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="css/output.css">
    <!-- Dashboard Styles Generales -->
    <link rel="stylesheet" href="css/dashboard-styles.css">
    <!-- DataTables Dashboard Compartido -->
    <link rel="stylesheet" href="css/datatables-dashboard.css">
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="assets/css/datatables.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
</head>

<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50">
    
    <div class="container mx-auto px-4 py-4">

        <!-- Acciones -->
        <section class="bg-white rounded-2xl card-shadow p-4 mb-4 slide-down">
            <h2 class="text-xl font-bold text-gray-700 mb-4 flex items-center gap-2">
                <i class="fas fa-tools text-purple-600"></i>
                Acciones
            </h2>
            <div class="flex flex-wrap gap-3 items-center justify-between">
                <div class="flex flex-wrap gap-3">
                    <button id="btnNuevo"
                        class="bg-green-500 hover:bg-green-600 text-white font-semibold py-2 px-4 rounded-lg shadow btn-hover-scale">
                        <i class="fas fa-plus mr-2"></i>
                        Nuevo Registro
                    </button>
                    <button id="btnExportar"
                        class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg shadow btn-hover-scale">
                        <i class="fas fa-file-excel mr-2"></i>
                        Exportar Excel
                    </button>
                    <button id="btnETL"
                        class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg shadow btn-hover-scale">
                        <i class="fa-solid fa-rotate mr-2"></i>
                        Cargar ETL
                    </button>
                </div>

                <!-- Combobox para Mostrar/Ocultar Columnas -->
                <div class="dropdown-columns">
                    <button id="btnToggleColumns"
                        class="bg-purple-500 hover:bg-purple-600 text-white font-semibold py-2 px-4 rounded-lg shadow btn-hover-scale flex items-center gap-2">
                        <i class="fas fa-columns"></i>
                        Mostrar/Ocultar columnas
                        <i class="fas fa-chevron-down text-sm"></i>
                    </button>

                    <div id="columnDropdown" class="dropdown-content">
                        <div class="dropdown-header">
                            <span>Seleccionar Columnas</span>
                            <button id="btnCloseDropdown" class="text-white hover:text-gray-200">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                        <div class="p-2">
                            <label class="column-toggle">
                                <input type="checkbox" class="column-checkbox" data-column="0" checked>
                                <span>ID</span>
                            </label>
                            <label class="column-toggle">
                                <input type="checkbox" class="column-checkbox" data-column="1" checked>
                                <span>Fecha</span>
                            </label>
                            <label class="column-toggle">
                                <input type="checkbox" class="column-checkbox" data-column="2" checked>
                                <span>Distrito</span>
                            </label>
                            <label class="column-toggle">
                                <input type="checkbox" class="column-checkbox" data-column="3" checked>
                                <span>Zona</span>
                            </label>
                            <label class="column-toggle">
                                <input type="checkbox" class="column-checkbox" data-column="4" checked>
                                <span>Canal</span>
                            </label>
                            <label class="column-toggle">
                                <input type="checkbox" class="column-checkbox" data-column="5" checked>
                                <span>Código</span>
                            </label>
                            <label class="column-toggle">
                                <input type="checkbox" class="column-checkbox" data-column="6" checked>
                                <span>Línea</span>
                            </label>
                            <label class="column-toggle">
                                <input type="checkbox" class="column-checkbox" data-column="7" checked>
                                <span>Sublínea</span>
                            </label>
                            <label class="column-toggle">
                                <input type="checkbox" class="column-checkbox" data-column="8" checked>
                                <span>Vendedor</span>
                            </label>
                            <label class="column-toggle">
                                <input type="checkbox" class="column-checkbox" data-column="9" checked>
                                <span>Cliente</span>
                            </label>
                            <label class="column-toggle">
                                <input type="checkbox" class="column-checkbox" data-column="10" checked disabled>
                                <span>Opciones (siempre visible)</span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Filtros -->
        <section id="filterSection" class="bg-white rounded-lg card-shadow p-3 mb-6 slide-down">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-bold text-gray-700 flex items-center gap-2">
                    <i class="fas fa-sliders-h text-purple-600"></i>
                    Filtros
                </h2>
                <!-- Botón para ocultar/mostrar filtros -->
                <div class="flex gap-2">
                    <button id="btnToggleFiltros" class="text-gray-500 hover:text-purple-600 transition">
                        <i class="fas fa-chevron-down"></i>
                    </button>
                    <button id="btnLimpiarFiltros" class="text-purple-600 hover:text-purple-700 font-semibold">
                        <i class="fas fa-times-circle mr-1"></i>
                        Limpiar filtros
                    </button>
                </div>
            </div>
            <!-- AGREGAR hidden AQUÍ PARA QUE INICIE OCULTO -->
            <div id="filterContent"
                class="hidden grid grid-cols-1 md:grid-cols-4 gap-4 transition-all duration-300 ease-in-out overflow-hidden">
                <!-- Filtros principales siempre visibles -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-calendar-alt mr-1 text-purple-600"></i>
                        Fecha Inicio
                    </label>
                    <input type="date" id="filterFechaInicio"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-calendar-alt mr-1 text-purple-600"></i>
                        Fecha Fin
                    </label>
                    <input type="date" id="filterFechaFin"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-map-marker-alt mr-1 text-purple-600"></i>
                        Distrito
                    </label>
                    <select id="filterDistrito"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                        <option value="">Todos los distritos</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-map mr-1 text-purple-600"></i>
                        Zona
                    </label>
                    <select id="filterZona"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                        <option value="">Todas las zonas</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-store mr-1 text-purple-600"></i>
                        Canal
                    </label>
                    <select id="filterCanal"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                        <option value="">Todos los canales</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-tag mr-1 text-purple-600"></i>
                        Línea
                    </label>
                    <select id="filterLinea"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                        <option value="">Todas las líneas</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-tags mr-1 text-purple-600"></i>
                        Sublínea
                    </label>
                    <select id="filterSublinea"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                        <option value="">Todas las sublíneas</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-user-tie mr-1 text-purple-600"></i>
                        Vendedor
                    </label>
                    <select id="filterVendedor"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                        <option value="">Todos los vendedores</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-user mr-1 text-purple-600"></i>
                        Cliente
                    </label>
                    <input type="text" id="filterCliente" placeholder="Buscar cliente..."
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                </div>
                <div class="mt-6 flex items-end">
                    <button id="btnAplicarFiltros"
                        class="bg-purple-500 hover:bg-purple-600 text-white font-semibold py-2 px-4 rounded-lg shadow btn-hover-scale">
                        <i class="fa-solid fa-filter"></i>
                        Filtrar
                    </button>
                </div>
            </div>
        </section>

        <!-- Tabla -->
        <section class="bg-white rounded-2xl card-shadow p-6 slide-down">
            <h2 class="text-xl font-bold text-gray-700 mb-4 flex items-center gap-2">
                <i class="fas fa-table text-purple-600"></i>
                Registros de Clientes Procesados
            </h2>
            <div class="overflow-x-auto">
                <!-- La tabla debe tener ID tablaClientes para que funcione con el JavaScript -->
                <table id="tablaClientes" class="min-w-full display" style="width:100%">
                    <!-- DataTables generará el contenido automáticamente -->
                </table>
            </div>
        </section>
    </div>

    <!-- Modal Formulario -->
    <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 p-4"
        style="display: none; overflow-y: auto;">
        <div class="bg-white rounded-2xl shadow-2xl max-w-4xl w-full my-8" style="max-height: calc(100vh - 4rem);">
            <div class="bg-gradient-to-r from-purple-500 to-indigo-600 p-6 rounded-t-2xl sticky top-0 z-10">
                <h3 id="modalTitle" class="text-2xl font-bold text-white">Nuevo Registro</h3>
            </div>
            <form id="modalForm" class="p-6" style="max-height: calc(100vh - 12rem); overflow-y: auto;">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Fecha -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Fecha *</label>
                        <input type="date" id="modalFecha" required
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>

                    <!-- Distrito -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Distrito</label>
                        <input type="text" id="modalDistrito"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>

                    <!-- Zona -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Zona</label>
                        <input type="text" id="modalZona"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>

                    <!-- Canal -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Canal</label>
                        <input type="text" id="modalCanal"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>

                    <!-- Código -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Código</label>
                        <input type="text" id="modalCodigo"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>

                    <!-- Línea -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Línea</label>
                        <input type="text" id="modalLinea"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>

                    <!-- Sublínea -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Sublínea</label>
                        <input type="text" id="modalSublinea"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>

                    <!-- Vendedor -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Vendedor</label>
                        <input type="text" id="modalVendedor"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>

                    <!-- Cliente -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Cliente *</label>
                        <input type="text" id="modalCliente" required
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>

                    <!-- Descripción -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Descripción</label>
                        <input type="text" id="modalDescripcion"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>

                    <!-- Ruta -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Ruta</label>
                        <input type="text" id="modalRuta"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>

                    <!-- Nombre Ruta -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre Ruta</label>
                        <input type="text" id="modalNomruta"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>

                    <!-- Unidad -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Unidad</label>
                        <input type="number" id="modalUnidad" step="0.01"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>

                    <!-- Peso -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Peso</label>
                        <input type="number" id="modalPeso" step="0.01"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>

                    <!-- Importe -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Importe</label>
                        <input type="number" id="modalImporte" step="0.01"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                    </div>

                </div>

                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" id="btnCancelar"
                        class="bg-gray-500 hover:bg-gray-600 text-white font-semibold py-2 px-6 rounded-lg">
                        Cancelar
                    </button>
                    <button type="button" id="btnGuardar"
                        class="bg-purple-500 hover:bg-purple-600 text-white font-semibold py-2 px-6 rounded-lg">
                        <i class="fas fa-save mr-2"></i>
                        Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal ETL -->
    <div id="modalETL" class="hidden fixed inset-0 bg-gray-800 bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-lg w-full max-w-md p-6 relative">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Ejecutar ETL</h2>
            <p class="text-gray-600 mb-4">Ingrese el rango de fechas para procesar los datos.</p>

            <div class="space-y-4">
                <div>
                    <label for="etlFechaInicio" class="block text-sm font-semibold text-gray-700">Fecha inicio</label>
                    <input type="date" id="etlFechaInicio"
                        class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-400 focus:outline-none">
                </div>
                <div>
                    <label for="etlFechaFin" class="block text-sm font-semibold text-gray-700">Fecha fin</label>
                    <input type="date" id="etlFechaFin"
                        class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-400 focus:outline-none">
                </div>
            </div>

            <div class="flex justify-end gap-3 mt-6">
                <button id="btnCancelarETL" class="bg-gray-400 hover:bg-gray-500 text-white py-2 px-4 rounded-lg shadow">
                    Cancelar
                </button>
                <button id="btnEjecutarETLConfirm" class="bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded-lg shadow">
                    Ejecutar
                </button>
            </div>
        </div>
    </div>

    <!-- Loading -->
    <div id="loading" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50"
        style="display: none;">
        <div class="bg-white p-6 rounded-xl shadow-2xl">
            <i class="fas fa-spinner fa-spin text-4xl text-purple-600 mb-2"></i>
            <p class="text-gray-700">Cargando...</p>
        </div>
    </div>

    <!-- Scripts -->
    <!-- jQuery (requerido por DataTables) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- DataTables JS -->
    <script src="https://cdn.datatables.net/2.0.8/js/dataTables.min.js"></script>

    <!-- Scripts DE CONFIGURACION IMPORTANTE EL ORDEN -->
    <script src="js/config/config.js"></script>
    <script src="js/config/config.cliente-procesado.js"></script>
    <script src="js/services/cliente-procesado.service.js"></script>
    <script src="js/controllers/cliente-procesado.controller.js"></script>
    

    <script>
        // Inicializar controlador al cargar la página
        document.addEventListener('DOMContentLoaded', () => {
            clienteProcesadoController.init();
        });
    </script>
</body>

</html>
